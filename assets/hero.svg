<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.55" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161a33"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#bb9af7" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#7aa2f7" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <!-- animated name gradient -->
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7de2ff"/>
      <stop offset="0.35" stop-color="#7aa2f7"/>
      <stop offset="0.7" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#ff79c6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.4 0; 0.4 0; -0.4 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <!-- shine sweep -->
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.40" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.50" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.60" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1.2 0; 1.4 0" dur="4.6s" repeatCount="indefinite"/>
    </linearGradient>
    <!-- grid line gradient -->
    <linearGradient id="gridV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7de2ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#7de2ff" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff79c6"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="gridClip"><rect x="0" y="302" width="1280" height="118"/></clipPath>
    <clipPath id="frame"><rect x="0" y="0" width="1280" height="420" rx="14"/></clipPath>
    <style><![CDATA[
      .tw { animation: twinkle 3.2s ease-in-out infinite; }
      @keyframes twinkle { 0%,100% { opacity:.12 } 50% { opacity:.95 } }
      .float-slow { animation: drift 9s ease-in-out infinite; }
      @keyframes drift { 0%,100% { opacity:.25 } 50% { opacity:.6 } }
    ]]></style>
  </defs>

  <g clip-path="url(#frame)">
  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#halo)"/>

  <!-- ══════════ twinkling stars ══════════ -->
  <g fill="#ffffff">
    <circle class="tw" cx="60"   cy="52"  r="1.4" style="animation-delay:0s"/>
    <circle class="tw" cx="150"  cy="120" r="1.1" style="animation-delay:1.1s"/>
    <circle class="tw" cx="235"  cy="38"  r="1.6" style="animation-delay:2.2s"/>
    <circle class="tw" cx="320"  cy="90"  r="1.0" style="animation-delay:0.6s"/>
    <circle class="tw" cx="405"  cy="30"  r="1.3" style="animation-delay:1.8s"/>
    <circle class="tw" cx="470"  cy="75"  r="1.0" style="animation-delay:2.7s"/>
    <circle class="tw" cx="560"  cy="42"  r="1.5" style="animation-delay:0.3s"/>
    <circle class="tw" cx="640"  cy="24"  r="1.2" style="animation-delay:1.5s"/>
    <circle class="tw" cx="726"  cy="66"  r="1.0" style="animation-delay:2.4s"/>
    <circle class="tw" cx="812"  cy="34"  r="1.5" style="animation-delay:0.9s"/>
    <circle class="tw" cx="905"  cy="88"  r="1.1" style="animation-delay:1.9s"/>
    <circle class="tw" cx="980"  cy="46"  r="1.4" style="animation-delay:0.2s"/>
    <circle class="tw" cx="1065" cy="110" r="1.0" style="animation-delay:2.9s"/>
    <circle class="tw" cx="1150" cy="58"  r="1.5" style="animation-delay:1.2s"/>
    <circle class="tw" cx="1235" cy="96"  r="1.2" style="animation-delay:0.5s"/>
    <circle class="tw" cx="105"  cy="205" r="1.0" style="animation-delay:2.0s"/>
    <circle class="tw" cx="300"  cy="180" r="1.1" style="animation-delay:0.8s"/>
    <circle class="tw" cx="520"  cy="140" r="0.9" style="animation-delay:2.5s"/>
    <circle class="tw" cx="760"  cy="150" r="1.0" style="animation-delay:1.4s"/>
    <circle class="tw" cx="1000" cy="185" r="1.2" style="animation-delay:0.4s"/>
    <circle class="tw" cx="1195" cy="170" r="0.9" style="animation-delay:2.1s"/>
    <circle class="tw" cx="55"   cy="280" r="1.0" style="animation-delay:1.6s"/>
    <circle class="tw" cx="1225" cy="265" r="1.1" style="animation-delay:0.7s"/>
  </g>

  <!-- ══════════ shooting stars ══════════ -->
  <g opacity="0">
    <line x1="-90" y1="-3" x2="0" y2="0" stroke="url(#tail)" stroke-width="2"/>
    <circle r="2.2" fill="#ffffff"/>
    <animateMotion path="M180,30 L640,190" dur="7s" keyPoints="0;1;1" keyTimes="0;0.16;1" calcMode="linear" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.08;0.16;1" dur="7s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <line x1="-80" y1="-2" x2="0" y2="0" stroke="url(#tail)" stroke-width="1.6"/>
    <circle r="1.8" fill="#ffffff"/>
    <animateMotion path="M1150,50 L760,210" dur="9s" keyPoints="0;1;1" keyTimes="0;0.14;1" calcMode="linear" repeatCount="indefinite" begin="3.5s"/>
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.07;0.14;1" dur="9s" repeatCount="indefinite" begin="3.5s"/>
  </g>

  <!-- ══════════ synthwave sun on horizon ══════════ -->
  <g filter="url(#glow)">
    <path d="M 585 302 A 55 55 0 0 1 695 302 Z" fill="url(#sun)" opacity="0.8">
      <animate attributeName="opacity" values="0.6;0.9;0.6" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ══════════ perspective grid ══════════ -->
  <g clip-path="url(#gridClip)">
    <g stroke="url(#gridV)" stroke-width="1">
      <line x1="640" y1="302" x2="-460" y2="420"/>
      <line x1="640" y1="302" x2="-240" y2="420"/>
      <line x1="640" y1="302" x2="-20"  y2="420"/>
      <line x1="640" y1="302" x2="130"  y2="420"/>
      <line x1="640" y1="302" x2="280"  y2="420"/>
      <line x1="640" y1="302" x2="420"  y2="420"/>
      <line x1="640" y1="302" x2="530"  y2="420"/>
      <line x1="640" y1="302" x2="640"  y2="420"/>
      <line x1="640" y1="302" x2="750"  y2="420"/>
      <line x1="640" y1="302" x2="860"  y2="420"/>
      <line x1="640" y1="302" x2="1000" y2="420"/>
      <line x1="640" y1="302" x2="1150" y2="420"/>
      <line x1="640" y1="302" x2="1300" y2="420"/>
      <line x1="640" y1="302" x2="1520" y2="420"/>
      <line x1="640" y1="302" x2="1740" y2="420"/>
    </g>
    <!-- moving horizontal lines (toward viewer) -->
    <g stroke="#7de2ff" stroke-width="1">
      <line x1="0" x2="1280" y1="302" y2="302" opacity="0">
        <animate attributeName="y1" values="302;306;314;327;346;375;420" keyTimes="0;.18;.35;.52;.7;.86;1" dur="5.1s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="302;306;314;327;346;375;420" keyTimes="0;.18;.35;.52;.7;.86;1" dur="5.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.45;.3;.08" keyTimes="0;.3;.8;1" dur="5.1s" repeatCount="indefinite"/>
      </line>
      <line x1="0" x2="1280" y1="302" y2="302" opacity="0">
        <animate attributeName="y1" values="302;306;314;327;346;375;420" keyTimes="0;.18;.35;.52;.7;.86;1" dur="5.1s" begin="-0.85s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="302;306;314;327;346;375;420" keyTimes="0;.18;.35;.52;.7;.86;1" dur="5.1s" begin="-0.85s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.45;.3;.08" keyTimes="0;.3;.8;1" dur="5.1s" begin="-0.85s" repeatCount="indefinite"/>
      </line>
      <line x1="0" x2="1280" y1="302" y2="302" opacity="0">
        <animate attributeName="y1" values="302;306;314;327;346;375;420" keyTimes="0;.18;.35;.52;.7;.86;1" dur="5.1s" begin="-1.7s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="302;306;314;327;346;375;420" keyTimes="0;.18;.35;.52;.7;.86;1" dur="5.1s" begin="-1.7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.45;.3;.08" keyTimes="0;.3;.8;1" dur="5.1s" begin="-1.7s" repeatCount="indefinite"/>
      </line>
      <line x1="0" x2="1280" y1="302" y2="302" opacity="0">
        <animate attributeName="y1" values="302;306;314;327;346;375;420" keyTimes="0;.18;.35;.52;.7;.86;1" dur="5.1s" begin="-2.55s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="302;306;314;327;346;375;420" keyTimes="0;.18;.35;.52;.7;.86;1" dur="5.1s" begin="-2.55s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.45;.3;.08" keyTimes="0;.3;.8;1" dur="5.1s" begin="-2.55s" repeatCount="indefinite"/>
      </line>
      <line x1="0" x2="1280" y1="302" y2="302" opacity="0">
        <animate attributeName="y1" values="302;306;314;327;346;375;420" keyTimes="0;.18;.35;.52;.7;.86;1" dur="5.1s" begin="-3.4s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="302;306;314;327;346;375;420" keyTimes="0;.18;.35;.52;.7;.86;1" dur="5.1s" begin="-3.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.45;.3;.08" keyTimes="0;.3;.8;1" dur="5.1s" begin="-3.4s" repeatCount="indefinite"/>
      </line>
      <line x1="0" x2="1280" y1="302" y2="302" opacity="0">
        <animate attributeName="y1" values="302;306;314;327;346;375;420" keyTimes="0;.18;.35;.52;.7;.86;1" dur="5.1s" begin="-4.25s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="302;306;314;327;346;375;420" keyTimes="0;.18;.35;.52;.7;.86;1" dur="5.1s" begin="-4.25s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.45;.3;.08" keyTimes="0;.3;.8;1" dur="5.1s" begin="-4.25s" repeatCount="indefinite"/>
      </line>
    </g>
    <!-- horizon glow -->
    <line x1="0" y1="302" x2="1280" y2="302" stroke="#7de2ff" stroke-width="1.5" opacity="0.7" filter="url(#softglow)"/>
  </g>

  <!-- ══════════ floating isometric cubes ══════════ -->
  <g transform="translate(150,140)" filter="url(#softglow)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -12; 0 0" dur="5.4s" repeatCount="indefinite"/>
      <path d="M0,-40 L35,-20 L0,0 L-35,-20 Z" fill="#7aa2f7" opacity="0.9"/>
      <path d="M0,0 L35,-20 L35,28 L0,48 Z" fill="#41527e" opacity="0.95"/>
      <path d="M0,0 L-35,-20 L-35,28 L0,48 Z" fill="#2a3555" opacity="0.95"/>
      <path d="M0,-40 L35,-20 L0,0 L-35,-20 Z M0,0 L0,48 M35,-20 L35,28 M-35,-20 L-35,28" fill="none" stroke="#7de2ff" stroke-width="1" opacity="0.7"/>
    </g>
  </g>
  <g transform="translate(1128,150) scale(0.82)" filter="url(#softglow)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -14; 0 0" dur="6.6s" repeatCount="indefinite"/>
      <path d="M0,-40 L35,-20 L0,0 L-35,-20 Z" fill="#bb9af7" opacity="0.9"/>
      <path d="M0,0 L35,-20 L35,28 L0,48 Z" fill="#5a4a8a" opacity="0.95"/>
      <path d="M0,0 L-35,-20 L-35,28 L0,48 Z" fill="#3a2f5e" opacity="0.95"/>
      <path d="M0,-40 L35,-20 L0,0 L-35,-20 Z M0,0 L0,48 M35,-20 L35,28 M-35,-20 L-35,28" fill="none" stroke="#ff79c6" stroke-width="1" opacity="0.6"/>
    </g>
  </g>
  <g transform="translate(238,258) scale(0.42)" filter="url(#softglow)" opacity="0.85">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -18; 0 0" dur="4.4s" repeatCount="indefinite"/>
      <path d="M0,-40 L35,-20 L0,0 L-35,-20 Z" fill="#7de2ff" opacity="0.9"/>
      <path d="M0,0 L35,-20 L35,28 L0,48 Z" fill="#2e6a7e" opacity="0.95"/>
      <path d="M0,0 L-35,-20 L-35,28 L0,48 Z" fill="#1d4553" opacity="0.95"/>
    </g>
  </g>
  <g transform="translate(1042,262) scale(0.4)" filter="url(#softglow)" opacity="0.85">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -16; 0 0" dur="5s" begin="-2s" repeatCount="indefinite"/>
      <path d="M0,-40 L35,-20 L0,0 L-35,-20 Z" fill="#9ece6a" opacity="0.9"/>
      <path d="M0,0 L35,-20 L35,28 L0,48 Z" fill="#4e6a37" opacity="0.95"/>
      <path d="M0,0 L-35,-20 L-35,28 L0,48 Z" fill="#33461f" opacity="0.95"/>
    </g>
  </g>

  <!-- floating code glyphs -->
  <g fill="#7aa2f7" font-family="Consolas, 'Courier New', monospace" font-size="26" font-weight="bold">
    <text x="330" y="120" class="float-slow" opacity="0.3">{ }</text>
    <text x="895" y="130" class="float-slow" opacity="0.3" style="animation-delay:2s">&lt;/&gt;</text>
    <text x="435" y="230" class="float-slow" opacity="0.22" style="animation-delay:4s" font-size="20">( )</text>
    <text x="800" y="235" class="float-slow" opacity="0.22" style="animation-delay:1s" font-size="20">[ ]</text>
  </g>

  <!-- ══════════ NAME ══════════ -->
  <text x="640" y="168" text-anchor="middle" font-size="86" font-weight="800" letter-spacing="8" fill="url(#nameGrad)" filter="url(#glow)">RAM PATEL</text>
  <text x="640" y="168" text-anchor="middle" font-size="86" font-weight="800" letter-spacing="8" fill="url(#shine)">RAM PATEL</text>

  <!-- subtitle -->
  <text x="640" y="212" text-anchor="middle" font-size="19" font-weight="600" letter-spacing="10" fill="#7de2ff" opacity="0.95">F U L L - S T A C K &#160; D E V E L O P E R</text>

  <!-- rotating roles -->
  <g text-anchor="middle" font-size="17" font-weight="500" fill="#c0caf5">
    <text x="640" y="252" opacity="0">⚡ MERN + AI — I build real products, not just demos
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.29;0.33;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="640" y="252" opacity="0">🏢 Production SaaS engineer @ ShipCube — Clockie · OutreachHub
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.29;0.33;1" dur="12s" begin="-8s" repeatCount="indefinite"/>
    </text>
    <text x="640" y="252" opacity="0">🧠 Backend architecture · Applied AI · Clean UX
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.29;0.33;1" dur="12s" begin="-4s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- bottom fade -->
  <rect x="0" y="380" width="1280" height="40" fill="#0d1117" opacity="0.35"/>
  </g>
</svg>
