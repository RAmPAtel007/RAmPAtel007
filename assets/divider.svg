<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 26">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7de2ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#ff79c6" stop-opacity="0"/>
    </linearGradient>
    <filter id="dglow" x="-50%" y="-400%" width="200%" height="900%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <line x1="30" y1="13" x2="1170" y2="13" stroke="#3b4261" stroke-width="1" opacity="0.55"/>
  <rect x="-220" y="11" width="220" height="4" rx="2" fill="url(#beam)" filter="url(#dglow)">
    <animate attributeName="x" values="-220;1200" dur="3.6s" repeatCount="indefinite"/>
  </rect>
  <circle cx="600" cy="13" r="3.5" fill="#7aa2f7" opacity="0.9">
    <animate attributeName="r" values="2.5;4.5;2.5" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>
