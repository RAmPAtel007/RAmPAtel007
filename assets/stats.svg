<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 260" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101527"/>
      <stop offset="1" stop-color="#0b0e1a"/>
    </linearGradient>
    <linearGradient id="sborder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7de2ff" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#bb9af7" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff79c6" stop-opacity="0.5"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.3 0; 0.3 0; -0.3 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="sglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style><![CDATA[
      .num { font-weight: 800; font-size: 34px; fill: #e6edf3; }
      .lab { font-weight: 700; font-size: 13.5px; letter-spacing: 1.5px; }
      .sub { font-size: 11.5px; fill: #8891b3; }
      .fadein { opacity: 0; animation: appear 0.9s ease-out forwards; }
      @keyframes appear { to { opacity: 1 } }
      .pulse { animation: ringpulse 3.4s ease-in-out infinite; }
      @keyframes ringpulse { 0%,100% { opacity: .85 } 50% { opacity: 1 } }
    ]]></style>
  </defs>

  <!-- panel -->
  <rect x="6" y="6" width="1268" height="248" rx="16" fill="url(#sbg)"/>
  <rect x="6" y="6" width="1268" height="248" rx="16" fill="none" stroke="url(#sborder)" stroke-width="1.5"/>

  <!-- header -->
  <text x="640" y="40" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="7" fill="#7aa2f7">⚡ R E A L - W O R L D &#160; I M P A C T ⚡</text>

  <!-- ═══════ tile 1 : production commits ═══════ -->
  <g transform="translate(190,140)">
    <circle r="56" fill="none" stroke="#232946" stroke-width="7"/>
    <circle r="56" fill="none" stroke="#7de2ff" stroke-width="7" stroke-linecap="round" class="pulse"
            stroke-dasharray="351.9" stroke-dashoffset="351.9" transform="rotate(-90)" filter="url(#sglow)">
      <animate attributeName="stroke-dashoffset" from="351.9" to="52.8" dur="1.8s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    </circle>
    <circle r="66" fill="none" stroke="#7de2ff" stroke-width="1" stroke-dasharray="3 9" opacity="0.35">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </circle>
    <text y="12" text-anchor="middle" class="num fadein" style="animation-delay:.7s">648+</text>
  </g>
  <text x="190" y="228" text-anchor="middle" class="lab fadein" fill="#7de2ff" style="animation-delay:.9s">PRODUCTION COMMITS</text>
  <text x="190" y="246" text-anchor="middle" class="sub fadein" style="animation-delay:1s">Clockie · OutreachHub @ ShipCube</text>

  <!-- ═══════ tile 2 : live products ═══════ -->
  <g transform="translate(490,140)">
    <circle r="56" fill="none" stroke="#232946" stroke-width="7"/>
    <circle r="56" fill="none" stroke="#ff79c6" stroke-width="7" stroke-linecap="round" class="pulse"
            stroke-dasharray="351.9" stroke-dashoffset="351.9" transform="rotate(-90)" filter="url(#sglow)">
      <animate attributeName="stroke-dashoffset" from="351.9" to="105.6" dur="1.8s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    </circle>
    <circle r="66" fill="none" stroke="#ff79c6" stroke-width="1" stroke-dasharray="3 9" opacity="0.35">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="24s" repeatCount="indefinite"/>
    </circle>
    <text y="12" text-anchor="middle" class="num fadein" style="animation-delay:1s">2</text>
  </g>
  <text x="490" y="228" text-anchor="middle" class="lab fadein" fill="#ff79c6" style="animation-delay:1.2s">LIVE SAAS PRODUCTS</text>
  <text x="490" y="246" text-anchor="middle" class="sub fadein" style="animation-delay:1.3s">serving real users in production</text>

  <!-- ═══════ tile 3 : contributions ═══════ -->
  <g transform="translate(790,140)">
    <circle r="56" fill="none" stroke="#232946" stroke-width="7"/>
    <circle r="56" fill="none" stroke="#bb9af7" stroke-width="7" stroke-linecap="round" class="pulse"
            stroke-dasharray="351.9" stroke-dashoffset="351.9" transform="rotate(-90)" filter="url(#sglow)">
      <animate attributeName="stroke-dashoffset" from="351.9" to="35.2" dur="1.8s" begin="0.8s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    </circle>
    <circle r="66" fill="none" stroke="#bb9af7" stroke-width="1" stroke-dasharray="3 9" opacity="0.35">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </circle>
    <text y="12" text-anchor="middle" class="num fadein" style="animation-delay:1.3s">1.1K+</text>
  </g>
  <text x="790" y="228" text-anchor="middle" class="lab fadein" fill="#bb9af7" style="animation-delay:1.5s">CONTRIBUTIONS</text>
  <text x="790" y="246" text-anchor="middle" class="sub fadein" style="animation-delay:1.6s">since March 2024 — and accelerating</text>

  <!-- ═══════ tile 4 : repositories ═══════ -->
  <g transform="translate(1090,140)">
    <circle r="56" fill="none" stroke="#232946" stroke-width="7"/>
    <circle r="56" fill="none" stroke="#9ece6a" stroke-width="7" stroke-linecap="round" class="pulse"
            stroke-dasharray="351.9" stroke-dashoffset="351.9" transform="rotate(-90)" filter="url(#sglow)">
      <animate attributeName="stroke-dashoffset" from="351.9" to="77.4" dur="1.8s" begin="1.1s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    </circle>
    <circle r="66" fill="none" stroke="#9ece6a" stroke-width="1" stroke-dasharray="3 9" opacity="0.35">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="24s" repeatCount="indefinite"/>
    </circle>
    <text y="12" text-anchor="middle" class="num fadein" style="animation-delay:1.6s">30+</text>
  </g>
  <text x="1090" y="228" text-anchor="middle" class="lab fadein" fill="#9ece6a" style="animation-delay:1.8s">PUBLIC REPOS</text>
  <text x="1090" y="246" text-anchor="middle" class="sub fadein" style="animation-delay:1.9s">full-stack · AI · systems · DSA</text>

  <!-- connecting spark line -->
  <line x1="246" y1="140" x2="434" y2="140" stroke="#3b4261" stroke-width="1" opacity="0.5"/>
  <line x1="546" y1="140" x2="734" y2="140" stroke="#3b4261" stroke-width="1" opacity="0.5"/>
  <line x1="846" y1="140" x2="1034" y2="140" stroke="#3b4261" stroke-width="1" opacity="0.5"/>
  <circle r="2.5" fill="#7de2ff" filter="url(#sglow)">
    <animateMotion path="M246,140 L434,140" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.5" fill="#ff79c6" filter="url(#sglow)">
    <animateMotion path="M546,140 L734,140" dur="2.6s" begin="0.9s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.5" fill="#bb9af7" filter="url(#sglow)">
    <animateMotion path="M846,140 L1034,140" dur="2.6s" begin="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>
