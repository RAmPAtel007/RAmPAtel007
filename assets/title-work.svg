<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 74" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#ff79c6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.25 0; 0.25 0; -0.25 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="ug" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bb9af7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff79c6"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
    </linearGradient>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <text x="380" y="40" text-anchor="middle" font-size="31" font-weight="800" letter-spacing="2.5" fill="url(#tg)" filter="url(#tglow)">💼  PROFESSIONAL WORK</text>
  <g stroke="#bb9af7" stroke-width="1.5" opacity="0.55">
    <path d="M120,30 L98,37 L120,44" fill="none">
      <animate attributeName="opacity" values="0.25;0.8;0.25" dur="3.4s" repeatCount="indefinite"/>
    </path>
    <path d="M640,30 L662,37 L640,44" fill="none">
      <animate attributeName="opacity" values="0.25;0.8;0.25" dur="3.4s" begin="-1.7s" repeatCount="indefinite"/>
    </path>
  </g>
  <rect x="230" y="56" width="300" height="2.5" rx="1.25" fill="url(#ug)">
    <animate attributeName="width" values="220;300;220" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="270;230;270" dur="4s" repeatCount="indefinite"/>
  </rect>
  <circle cy="57.2" r="3" fill="#ff79c6" filter="url(#tglow)">
    <animate attributeName="cx" values="230;530;230" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
