<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 190" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161a33"/>
      <stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="ftext" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7de2ff"/>
      <stop offset="0.5" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#ff79c6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.3 0; 0.3 0; -0.3 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="fgrid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7de2ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#7de2ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="fglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="fframe"><rect width="1280" height="190" rx="14"/></clipPath>
    <style><![CDATA[
      .ftw { animation: ftwinkle 3s ease-in-out infinite; }
      @keyframes ftwinkle { 0%,100% { opacity:.15 } 50% { opacity:.9 } }
    ]]></style>
  </defs>
  <g clip-path="url(#fframe)">
  <rect width="1280" height="190" fill="url(#fbg)"/>
  <line x1="0" y1="10" x2="1280" y2="10" stroke="#7de2ff" stroke-width="1.2" opacity="0.6" filter="url(#fglow)"/>
  <g stroke="url(#fgrid)" stroke-width="1">
    <line x1="640" y1="10" x2="-320" y2="190"/><line x1="640" y1="10" x2="-60" y2="190"/>
    <line x1="640" y1="10" x2="150" y2="190"/><line x1="640" y1="10" x2="330" y2="190"/>
    <line x1="640" y1="10" x2="490" y2="190"/><line x1="640" y1="10" x2="640" y2="190"/>
    <line x1="640" y1="10" x2="790" y2="190"/><line x1="640" y1="10" x2="950" y2="190"/>
    <line x1="640" y1="10" x2="1130" y2="190"/><line x1="640" y1="10" x2="1340" y2="190"/>
    <line x1="640" y1="10" x2="1600" y2="190"/>
  </g>
  <g fill="#ffffff">
    <circle class="ftw" cx="140" cy="60" r="1.3" style="animation-delay:.4s"/>
    <circle class="ftw" cx="330" cy="95" r="1.0" style="animation-delay:1.6s"/>
    <circle class="ftw" cx="960" cy="80" r="1.2" style="animation-delay:.9s"/>
    <circle class="ftw" cx="1140" cy="55" r="1.4" style="animation-delay:2.2s"/>
    <circle class="ftw" cx="520" cy="60" r="1.0" style="animation-delay:2.8s"/>
    <circle class="ftw" cx="790" cy="55" r="1.1" style="animation-delay:.1s"/>
  </g>
  <text x="640" y="92" text-anchor="middle" font-size="26" font-weight="700" letter-spacing="1.5" fill="url(#ftext)" filter="url(#fglow)">Crafted with 💜 by Ram Patel</text>
  <text x="640" y="128" text-anchor="middle" font-size="14.5" font-weight="500" fill="#a9b1d6" opacity="0.9">⭐ If something here helped or impressed you — a star makes my day</text>
  <text x="640" y="163" text-anchor="middle" font-size="12.5" letter-spacing="4" fill="#565f89">B U I L D &#160; · &#160; S H I P &#160; · &#160; R E P E A T</text>
  </g>
</svg>
